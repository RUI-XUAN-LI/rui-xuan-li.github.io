<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDSS 2025</title>
  <link rel="icon" href="../images/myfig3.jpg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/custom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-activity-id="2025-ndss" data-activity-lang="en">
  <main>
    <aside class="sidebar" data-sidebar>
      <div class="sidebar-info">
        <figure class="avatar-box"><img src="../images/myfig3.jpg" alt="Ruixuan Li" data-profile-avatar></figure>
        <div class="info-content">
          <h1 class="name" data-profile-name>Ruixuan Li</h1>
          <p class="title" data-profile-affiliation>Tsinghua University</p>
        </div>
        <button class="info_more-btn" data-sidebar-btn><span>Show Contacts</span><ion-icon name="chevron-down"></ion-icon></button>
      </div>
      <div class="sidebar-info_more">
        <div class="separator"></div>
        <ul class="contacts-list">
          <li class="contact-item"><div class="icon-box"><ion-icon name="mail-outline"></ion-icon></div><div class="contact-info"><p class="contact-title">Email</p><a data-profile-email></a></div></li>
          <li class="contact-item"><div class="icon-box"><ion-icon name="location-outline"></ion-icon></div><div class="contact-info"><p class="contact-title">Location</p><address data-profile-location></address></div></li>
          <li class="contact-item"><a class="icon-box"><ion-icon name="school-outline"></ion-icon></a><div class="contact-info"><a class="underlinea profile-scholar" target="_blank" rel="noopener noreferrer" data-profile-scholar>Google scholar</a></div></li>
        </ul>
        <div class="separator"></div>
      </div>
    </aside>
    <div class="main-content"><article class="about active" id="talkContent"></article></div>
  </main>
  <script src="../data/site-data.js"></script>
  <script src="../data/activities.js"></script>
  <script src="../js/render-talk.js"></script>
  <script src="../js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
